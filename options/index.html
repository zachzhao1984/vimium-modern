<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vimium Modern 设置</title>
<style>
/* ============================================================================
   令牌 —— 与 Omnibar 原型共用同一套视觉语言
   ========================================================================== */
:root {
  color-scheme: light;

  --v-accent: #1660c9;          /* 品牌蓝文字色 */
  --v-accent-hi: #1972e7;       /* 品牌蓝装饰色 */
  --v-on-accent: #fff;          /* 品牌蓝底上的文字色（白字 = 4.56:1） */
  --v-accent-soft: rgba(25, 114, 231, .10);
  --v-accent-glow: rgba(25, 114, 231, .26);

  --v-surface: rgba(255, 255, 255, .74);
  --v-surface-raised: rgba(255, 255, 255, .90);
  --v-surface-sunken: rgba(0, 0, 0, .045);
  --v-surface-card: rgba(255, 255, 255, .68);

  --v-hairline: rgba(0, 0, 0, .11);
  --v-hairline-strong: rgba(0, 0, 0, .17);

  --v-text: #1c1c1e;
  --v-text-dim: #5e5e66;
  /* 三级文本（分组头、命令名、表头、侧栏分组标题）
     —— 原 #82828a 在面板底上只有 3.30:1，达不到 AA。
     #686872 在白/面板/分组头/徽章底/侧栏/表头六种底色上最差 4.78:1，全部达标。 */
  --v-text-faint: #686872;

  --v-sel-bg: rgba(25, 114, 231, .10);
  --v-sel-text: #1c1c1e;

  --v-danger: #b32712;
  --v-danger-soft: rgba(179, 39, 18, .09);
  --v-warn: #92600a;
  --v-warn-soft: rgba(146, 96, 10, .11);
  /* 成功绿 —— 原 #1a7f43 在自己的 soft 底色上只有 4.17:1（差一点没到 AA）。
     #156734 在 soft 底上 5.74:1，纯白底上 6.95:1。 */
  --v-ok: #156734;
  --v-ok-soft: rgba(21, 103, 52, .11);

  --v-shadow-panel: 0 24px 64px rgba(0, 0, 0, .22), 0 2px 8px rgba(0, 0, 0, .10);
  --v-shadow-card: 0 1px 2px rgba(0, 0, 0, .05);

  --r-panel: 12px;
  --r-card: 10px;
  --r-field: 8px;
  --r-chip: 5px;

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;

  --ease-out: cubic-bezier(.2, .9, .3, 1);
  --ease-inout: cubic-bezier(.4, 0, .2, 1);
  --dur: 140ms;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --v-accent: #9ec5ff;
  --v-accent-hi: #5a9cf5;
  /* 深色的品牌蓝是浅蓝，白字只有 2.80:1 —— 改用深色文字（6.08:1） */
  --v-on-accent: #16171a;
  --v-accent-soft: rgba(90, 156, 245, .16);
  --v-accent-glow: rgba(90, 156, 245, .32);
  --v-surface: rgba(28, 28, 30, .68);
  --v-surface-raised: rgba(60, 60, 64, .78);
  --v-surface-sunken: rgba(255, 255, 255, .055);
  --v-surface-card: rgba(46, 46, 50, .62);
  --v-hairline: rgba(255, 255, 255, .12);
  --v-hairline-strong: rgba(255, 255, 255, .19);
  --v-text: #f2f2f7;
  --v-text-dim: #a8a8b0;
  /* 深色下的三级文本 —— 原 #8a8a92 在分组头底上只有 4.12:1。
     #9e9ea8 在五种深色底上最差 4.82:1。 */
  --v-text-faint: #9e9ea8;
  --v-sel-bg: rgba(90, 156, 245, .16);
  --v-sel-text: #f2f2f7;
  --v-danger: #ff9b85;
  --v-danger-soft: rgba(255, 155, 133, .14);
  --v-warn: #e8b563;
  --v-warn-soft: rgba(232, 181, 99, .14);
  --v-ok: #5fd98a;
  --v-ok-soft: rgba(95, 217, 138, .14);
  --v-shadow-panel: 0 24px 64px rgba(0, 0, 0, .6), 0 2px 8px rgba(0, 0, 0, .42);
  --v-shadow-card: 0 1px 2px rgba(0, 0, 0, .32);
}

/* ============================================================================
   基础
   ========================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  font-family: var(--font);
  color: var(--v-text);
  -webkit-font-smoothing: antialiased;
}
body {
  background:
    radial-gradient(1100px 700px at 8% -12%, #dde7f6 0%, transparent 58%),
    radial-gradient(880px 600px at 94% 2%, #f2e7f7 0%, transparent 54%),
    linear-gradient(168deg, #f5f5f4 0%, #e9e9e8 100%);
  background-attachment: fixed;
  padding-bottom: 84px;
}
:root[data-theme="dark"] body {
  background:
    radial-gradient(1100px 700px at 8% -12%, #15243d 0%, transparent 58%),
    radial-gradient(880px 600px at 94% 2%, #291e37 0%, transparent 54%),
    linear-gradient(168deg, #18191c 0%, #101113 100%);
}

a { color: var(--v-accent); text-decoration: none; }
a:hover { text-decoration: underline; }

:focus-visible {
  outline: 2px solid var(--v-accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%);
  white-space: nowrap; border: 0;
}

kbd {
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--v-surface-sunken);
  border: .5px solid var(--v-hairline);
  color: var(--v-text-dim);
  white-space: nowrap;
}

/* ============================================================================
   布局
   ========================================================================== */
.app {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  gap: 30px;
  max-width: 1140px;
  margin: 0 auto;
  padding: 32px 28px 0;
}

.sidebar {
  position: sticky;
  top: 32px;
  align-self: start;
  max-height: calc(100vh - 64px);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 4px 13px;
  border-bottom: .5px solid var(--v-hairline);
}
.brand-mark {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  flex: none;
}
.brand-mark img { width: 30px; height: 30px; display: block; }
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.brand-sub { font-size: 11px; color: var(--v-text-faint); margin-top: 1px; }

.nav { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.nav-group-label {
  font-size: 10.5px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--v-text-faint);
  padding: 12px 10px 5px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 10px;
  border-radius: 7px;
  font-size: 13px;
  color: var(--v-text-dim);
  cursor: pointer;
  border: none;
  background: none;
  text-align: left;
  width: 100%;
  font-family: inherit;
  transition: background var(--dur) var(--ease-inout), color var(--dur) var(--ease-inout);
}
.nav-item:hover { background: var(--v-surface-sunken); color: var(--v-text); }
.nav-item[aria-current="true"] {
  background: var(--v-accent-soft);
  color: var(--v-accent);
  font-weight: 600;
}
.nav-item .nav-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--v-text-faint);
}
.nav-item[aria-current="true"] .nav-count { color: var(--v-accent); }
.nav-item .nav-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--v-accent);
  margin-left: auto;
  display: none;
  flex: none;
}
.nav-item.dirty .nav-dot { display: block; }
.nav-item.dirty .nav-count { display: none; }

.sidebar-status {
  margin-top: auto;
  padding: 9px 10px;
  border-radius: 8px;
  background: var(--v-surface-sunken);
  font-size: 11.5px;
  color: var(--v-text-dim);
  display: flex;
  align-items: flex-start;
  gap: 7px;
  line-height: 1.45;
}
.sidebar-status .status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--v-text-faint);
  flex: none;
  margin-top: 5px;
}
.sidebar-status.dirty { background: var(--v-warn-soft); color: var(--v-warn); }
.sidebar-status.dirty .status-dot { background: var(--v-warn); }
.sidebar-status.saved { background: var(--v-ok-soft); color: var(--v-ok); }
.sidebar-status.saved .status-dot { background: var(--v-ok); }

.main { min-width: 0; padding-bottom: 40px; }

.page-head {
  padding-bottom: 16px;
  margin-bottom: 20px;
  border-bottom: .5px solid var(--v-hairline);
}
.page-title {
  font-size: 21px; font-weight: 600; letter-spacing: -.02em;
  display: flex; align-items: center; gap: 9px;
}
.page-title .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--v-accent);
  flex: none;
}
.page-desc { font-size: 13px; color: var(--v-text-dim); margin-top: 5px; line-height: 1.5; max-width: 70ch; }

.section { margin-bottom: 26px; }
.section[hidden] { display: none; }

.card {
  background: var(--v-surface-card);
  border: .5px solid var(--v-hairline);
  border-radius: var(--r-card);
  box-shadow: var(--v-shadow-card);
  overflow: hidden;
}
.card + .card { margin-top: 10px; }

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
  padding: 12px 16px;
}
.row + .row { border-top: .5px solid var(--v-hairline); }
.row.stack { grid-template-columns: minmax(0, 1fr); align-items: stretch; }
.row.stack .row-control { justify-content: flex-start; }
.row-label { font-size: 13px; font-weight: 500; }
.row-hint { font-size: 12px; color: var(--v-text-dim); margin-top: 2px; line-height: 1.45; max-width: 64ch; }
.row-control { flex: none; display: flex; align-items: center; gap: 8px; }
.row-reset {
  font-size: 11.5px;
  color: var(--v-accent);
  cursor: pointer;
  background: none; border: none;
  font-family: inherit;
  padding: 2px 5px;
  border-radius: 4px;
}
.row-reset:hover { background: var(--v-accent-soft); text-decoration: none; }

/* ============================================================================
   表单控件
   ========================================================================== */
.input, .textarea, .select {
  font-family: inherit;
  font-size: 13px;
  color: var(--v-text);
  background: var(--v-surface-raised);
  border: .5px solid var(--v-hairline-strong);
  border-radius: var(--r-field);
  padding: 6px 9px;
  min-width: 0;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none;
  border-color: var(--v-accent);
  box-shadow: 0 0 0 3px var(--v-accent-glow);
}
.input.invalid, .textarea.invalid, .cell-input.invalid {
  border-color: var(--v-danger);
  box-shadow: 0 0 0 3px var(--v-danger-soft);
}
.input { width: 190px; }
.input.mono, .textarea.mono { font-family: var(--mono); font-size: 12px; }
.textarea {
  width: 100%;
  min-height: 132px;
  line-height: 1.6;
  resize: vertical;
  white-space: pre;
  overflow-wrap: normal;
  overflow-x: auto;
}

.switch {
  position: relative;
  width: 40px; height: 24px;
  flex: none;
  border-radius: 999px;
  border: none;
  background: var(--v-hairline-strong);
  cursor: pointer;
  padding: 0;
  transition: background var(--dur) var(--ease-out);
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
  transition: transform var(--dur) var(--ease-out);
}
.switch[aria-checked="true"] { background: var(--v-accent-hi); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }

.radio-set { display: flex; flex-direction: column; gap: 7px; width: 100%; }
.radio-item {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 11px;
  border: .5px solid var(--v-hairline);
  border-radius: 8px;
  cursor: pointer;
  background: var(--v-surface-raised);
  transition: border-color var(--dur) var(--ease-inout), background var(--dur) var(--ease-inout);
}
.radio-item:hover { border-color: var(--v-hairline-strong); }
.radio-item:has(input:checked) {
  border-color: var(--v-accent);
  background: var(--v-accent-soft);
}
.radio-item input { margin: 2px 0 0; accent-color: var(--v-accent-hi); flex: none; }
.radio-text { font-size: 13px; }
.radio-hint { font-size: 11.5px; color: var(--v-text-dim); margin-top: 2px; line-height: 1.45; }
.radio-extra { margin-top: 7px; }

/* ============================================================================
   校验消息
   ========================================================================== */
.validation {
  margin-top: 8px;
  padding: 9px 11px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.55;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.validation.error { background: var(--v-danger-soft); color: var(--v-danger); }
.validation.warn { background: var(--v-warn-soft); color: var(--v-warn); }
.validation.ok { background: var(--v-ok-soft); color: var(--v-ok); }
.validation svg { width: 14px; height: 14px; flex: none; margin-top: 1px; }
.validation ul { margin: 0; padding-left: 17px; }
.validation li + li { margin-top: 3px; }
.validation code {
  font-family: var(--mono);
  font-size: 11px;
  background: rgba(0, 0, 0, .06);
  padding: 0 3px;
  border-radius: 3px;
}
:root[data-theme="dark"] .validation code { background: rgba(255, 255, 255, .09); }
.msg-slot { padding: 0 16px 12px; }
.msg-slot:empty { display: none; }

/* ============================================================================
   排除规则表
   ========================================================================== */
.rules { width: 100%; border-collapse: collapse; }
.rules thead th {
  font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--v-text-faint);
  text-align: left;
  padding: 9px 12px;
  border-bottom: .5px solid var(--v-hairline);
}
.rules thead th em {
  display: block;
  font-style: normal;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  opacity: .8;
  margin-top: 1px;
}
.rules tbody td { padding: 5px 8px; vertical-align: middle; }
.rules tbody td:first-child { padding-left: 12px; }
.rules tbody td:last-child { padding-right: 12px; width: 34px; }
.rules .cell-input {
  width: 100%;
  font-family: var(--mono);
  font-size: 12px;
  padding: 5px 8px;
  border-radius: 6px;
  border: .5px solid var(--v-hairline-strong);
  background: var(--v-surface-raised);
  color: var(--v-text);
}
.rules .cell-input:focus {
  outline: none;
  border-color: var(--v-accent);
  box-shadow: 0 0 0 3px var(--v-accent-glow);
}
.icon-btn {
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border: none; background: none;
  border-radius: 5px;
  color: var(--v-text-faint);
  cursor: pointer;
  flex: none;
}
.icon-btn:hover { background: var(--v-danger-soft); color: var(--v-danger); }
.icon-btn svg { width: 13px; height: 13px; }
.card-foot {
  padding: 9px 12px;
  border-top: .5px solid var(--v-hairline);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* ============================================================================
   按钮
   ========================================================================== */
.btn {
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  padding: 6px 13px;
  border-radius: 7px;
  border: .5px solid var(--v-hairline-strong);
  background: var(--v-surface-raised);
  color: var(--v-text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background var(--dur) var(--ease-inout), border-color var(--dur) var(--ease-inout);
}
.btn:hover { background: var(--v-surface-sunken); }
.btn:disabled { opacity: .45; cursor: default; }
/* 主按钮：填充色与文字色必须一起换，不能只换填充色。
   浅色下 #1972e7 + 白字 = 4.56:1；深色下 --v-accent-hi 是浅蓝
   #5a9cf5，白字只有 2.80:1 —— 所以深色改用深色文字（6.08:1）。 */
.btn.primary { background: var(--v-accent-hi); border-color: transparent; color: var(--v-on-accent); }
.btn.primary:hover { background: var(--v-accent); }
/* 禁用态不能保留白字 —— 浅灰底 + 白字只有 1.17:1，等于看不见 */
.btn.primary:disabled { background: var(--v-hairline-strong); color: var(--v-text-dim); }
.btn svg { width: 13px; height: 13px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ============================================================================
   键位捕获
   ========================================================================== */
.key-capture {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 12px;
  min-width: 118px;
  border: .5px solid var(--v-hairline-strong);
  border-radius: var(--r-field);
  background: var(--v-surface-raised);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--v-text);
}
.key-capture:hover { border-color: var(--v-accent); }
.key-capture.capturing {
  border-color: var(--v-accent);
  box-shadow: 0 0 0 3px var(--v-accent-glow);
  color: var(--v-accent);
}

/* ============================================================================
   键位映射表
   ========================================================================== */
.keymap-toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 12px;
  border-bottom: .5px solid var(--v-hairline);
}
.search-box { position: relative; flex: 1; min-width: 0; }
.search-box .input { width: 100%; padding-left: 29px; }
.search-box svg {
  position: absolute;
  left: 9px; top: 50%;
  transform: translateY(-50%);
  width: 13px; height: 13px;
  color: var(--v-text-faint);
  pointer-events: none;
}
.keymap-list { max-height: 520px; overflow-y: auto; }
.keymap-empty {
  padding: 26px; text-align: center;
  color: var(--v-text-faint); font-size: 12.5px;
}
.keymap-group-head {
  font-size: 10.5px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--v-text-faint);
  padding: 11px 14px 5px;
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--v-surface-card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.keymap-row {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 7px 14px;
  cursor: pointer;
  border-left: 2.5px solid transparent;
}
.keymap-row:hover { background: var(--v-surface-sunken); }
.keymap-row.sel { background: var(--v-sel-bg); border-left-color: var(--v-accent); }
.keymap-keys { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.key-sep { color: var(--v-text-faint); font-size: 10px; margin: 0 1px; }
.keymap-name {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--v-text-faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cmd-desc { font-size: 13px; }
.keymap-actions { display: flex; gap: 5px; align-items: center; }
.badge {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .02em;
  padding: 1.5px 6px;
  border-radius: 4px;
  background: var(--v-surface-sunken);
  color: var(--v-text-faint);
  white-space: nowrap;
}
.badge.adv { background: var(--v-warn-soft); color: var(--v-warn); }
.badge.changed { background: var(--v-accent-soft); color: var(--v-accent); }
.badge.unbound { border: 1px dashed var(--v-hairline-strong); background: none; }
.badge.opt { background: var(--v-surface-sunken); color: var(--v-text-dim); font-family: var(--mono); font-weight: 500; }

/* ============================================================================
   搜索引擎
   ========================================================================== */
.engine-row {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 9px 14px;
}
.engine-row + .engine-row { border-top: .5px solid var(--v-hairline); }
.engine-kw {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--v-accent);
  background: var(--v-accent-soft);
  padding: 3px 0;
  text-align: center;
  border-radius: 5px;
}
.engine-name { font-size: 13px; }
.engine-url { font-family: var(--mono); font-size: 11px; color: var(--v-text-faint); margin-top: 2px; overflow-wrap: anywhere; }
/* 没有这条规则时两个按钮是块级元素，会竖着叠在行尾（原型里就漏了） */
.engine-actions { display: flex; align-items: center; gap: 2px; }
/* 编辑不是危险操作，别跟着删除一起变红 */
.engine-actions [data-edit-engine]:hover { background: var(--v-accent-soft); color: var(--v-accent); }

/* ============================================================================
   链接提示预览
   ========================================================================== */
.hint-preview {
  padding: 14px 16px;
  border-top: .5px solid var(--v-hairline);
  background: var(--v-surface-sunken);
}
.hint-preview-label {
  font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--v-text-faint);
  margin-bottom: 9px;
}
/* 预览是一排「链接」，横向铺开更像个页面；竖排 6 行会把卡片拉得很长 */
.hint-links { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px 20px; }
.hint-link {
  display: flex; align-items: center; gap: 9px;
  font-size: 12.5px;
  color: var(--v-text-dim);
}
.hint-marker {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px; height: 19px;
  padding: 0 4px;
  border-radius: 4px;
  background: linear-gradient(180deg, #FFF785 0%, #FFC542 100%);
  border: 1px solid #E3BE23;
  color: #000;
  font-weight: 700;
  font-size: 11.5px;
  font-family: var(--mono);
  flex: none;
}
.hint-marker.filtered {
  background: linear-gradient(180deg, #FFEF9E 0%, #FFD468 100%);
  box-shadow: 0 0 0 2px rgba(255, 197, 66, .35);
}

/* ============================================================================
   底部保存条
   ========================================================================== */
.savebar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  background: var(--v-surface);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: .5px solid var(--v-hairline);
  box-shadow: 0 -4px 20px rgba(0, 0, 0, .07);
}
.savebar-inner {
  max-width: 1140px;
  margin: 0 auto;
  padding: 10px 28px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.savebar-text { font-size: 12.5px; color: var(--v-text-dim); flex: 1; min-width: 0; }
.savebar-text .changed-count { color: var(--v-warn); font-weight: 600; }
.savebar-text .err { color: var(--v-danger); font-weight: 600; }

/* ============================================================================
   原型说明
   ========================================================================== */
.prototype-note {
  margin-top: 30px;
  padding-top: 16px;
  border-top: .5px solid var(--v-hairline);
  font-size: 11.5px;
  color: var(--v-text-faint);
  line-height: 1.6;
}
.prototype-note .controls {
  display: flex; gap: 14px; align-items: center;
  margin-top: 9px; flex-wrap: wrap;
}
.seg {
  display: flex; gap: 2px;
  background: var(--v-surface-sunken);
  padding: 2px;
  border-radius: 7px;
}
.seg button {
  font-family: inherit;
  font-size: 11.5px;
  border: none; background: none;
  padding: 3px 9px;
  border-radius: 5px;
  color: var(--v-text-dim);
  cursor: pointer;
}
.seg button[aria-pressed="true"] {
  background: var(--v-surface-raised);
  color: var(--v-text);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
}

/* ============================================================================
   弹层
   ========================================================================== */
.scrim {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center;
  background: rgba(0, 0, 0, .3);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  padding: 20px;
  overflow-y: auto;
}
.dialog {
  width: 100%;
  max-width: 460px;
  background: var(--v-surface-raised);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: .5px solid var(--v-hairline-strong);
  border-radius: var(--r-panel);
  box-shadow: var(--v-shadow-panel);
  overflow: hidden;
}
.dialog-head { padding: 15px 18px 0; }
.dialog-title { font-size: 15px; font-weight: 600; }
.dialog-sub { font-family: var(--mono); font-size: 11.5px; color: var(--v-text-faint); margin-top: 2px; }
.dialog-body { padding: 14px 18px; }
.dialog-foot {
  padding: 11px 18px;
  border-top: .5px solid var(--v-hairline);
  display: flex; gap: 8px; align-items: center;
}
.dialog-foot .spacer { flex: 1; }
.field-label { font-size: 12.5px; font-weight: 500; margin-bottom: 7px; }
.field-hint { font-size: 11.5px; color: var(--v-text-faint); margin-top: 7px; line-height: 1.5; }
.opt-row { margin-bottom: 10px; }
.opt-name { font-family: var(--mono); font-size: 11.5px; color: var(--v-text-dim); margin-bottom: 4px; }
.opt-desc { font-size: 11px; color: var(--v-text-faint); margin-top: 3px; line-height: 1.45; }

/* ============================================================================
   响应式
   ========================================================================== */
@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 18px 16px 0; }
  .sidebar { position: static; max-height: none; }
  /* 窄屏时导航变成横向滚动条。系统滚动条太宽太重，这里收细成一条淡色轨道；
     不用 mask 做右侧渐隐 —— 那样即使滚到底，末尾的分区也会一直是被淡掉的状态。 */
  .nav {
    flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--v-hairline-strong) transparent;
  }
  .nav::-webkit-scrollbar { height: 5px; }
  .nav::-webkit-scrollbar-track { background: transparent; }
  .nav::-webkit-scrollbar-thumb { background: var(--v-hairline-strong); border-radius: 3px; }
  .nav-group-label { display: none; }
  .nav-item { white-space: nowrap; width: auto; }
  .nav-item .nav-count, .nav-item .nav-dot { display: none !important; }
  .sidebar-status { display: none; }
  .row { grid-template-columns: minmax(0, 1fr); gap: 9px; }
  .row-control { justify-content: flex-start; }
  .keymap-row { grid-template-columns: 80px minmax(0, 1fr); }
  .keymap-row .keymap-actions { grid-column: 1 / -1; }
  .savebar-inner { padding: 9px 16px; }
  .prototype-note { padding: 0 16px 22px; }
}

@media (max-width: 560px) {
  .engine-row { grid-template-columns: 44px minmax(0, 1fr); }
  .engine-row .engine-actions { grid-column: 1 / -1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>


<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img src="../icons/icon.svg" alt="" aria-hidden="true">
      </div>
      <div>
        <div class="brand-name">Vimium Modern</div>
        <div class="brand-sub">设置</div>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="设置分区"></nav>

    <div class="sidebar-status" id="sidebarStatus" role="status">
      <span class="status-dot"></span>
      <span id="sidebarStatusText">所有更改已保存</span>
    </div>
  </aside>

  <main class="main">
    <header class="page-head">
      <h1 class="page-title" id="pageTitle"><span class="dot"></span><span id="pageTitleText">键位映射</span></h1>
      <p class="page-desc" id="pageDesc"></p>
    </header>

    <section class="section" id="sec-language" hidden>
      <div class="card">
        <div class="row">
          <div>
            <label class="row-label" for="uiLanguage">界面语言</label>
            <div class="row-hint">选择 Vimium Modern 的显示语言。</div>
          </div>
          <div class="row-control">
            <select class="input" id="uiLanguage" disabled>
              <option value="en">English</option>
              <option value="zh-CN">简体中文</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="sec-keys">
      <div class="card">
        <div class="keymap-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14" stroke-linecap="round"/>
            </svg>
            <input class="input" id="keySearch" type="search" placeholder="搜索命令、命令名或按键…" aria-label="搜索命令、命令名或按键">
          </div>
          <button class="btn" id="textModeBtn" aria-pressed="false">文本模式</button>
          <button class="btn" id="addMapping">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M8 3.4v9.2M3.4 8h9.2"/>
            </svg>
            新建映射
          </button>
        </div>
        <div id="keymapVisual">
          <div class="keymap-list" id="keymapList" role="listbox" aria-label="命令列表"></div>
        </div>
        <div id="keymapText" hidden>
          <div style="padding:12px">
            <div class="field-label" style="margin-bottom:6px">键位映射配置</div>
            <textarea class="textarea mono" id="keyMappingsText" spellcheck="false" aria-label="键位映射配置"
              placeholder="map j scrollDown&#10;unmap j"></textarea>
            <div class="field-hint" style="margin-top:8px">
              每行一条：<code>map &lt;按键&gt; &lt;命令&gt; [选项]</code>、
              <code>unmap &lt;按键&gt;</code>、<code>unmapAll</code>、<code>mapkey &lt;从&gt; &lt;到&gt;</code>。
              <code>"</code> 或 <code>#</code> 开头是注释。
            </div>
            <div id="keyMappingsValidation"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="sec-links" hidden>
      <div class="card" id="card-linkHints"></div>
    </section>

    <section class="section" id="sec-exclusions" hidden>
      <div class="card">
        <table class="rules">
          <thead>
            <tr><th>网址模式</th><th>交还给网页的按键<em>留空则整条停用</em></th><th></th></tr>
          </thead>
          <tbody id="rulesBody"></tbody>
        </table>
        <div class="card-foot">
          <button class="btn" id="addRule">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M8 3.4v9.2M3.4 8h9.2"/>
            </svg>
            添加规则
          </button>
        </div>
      </div>
      <div id="rulesValidation"></div>
    </section>

    <section class="section" id="sec-engines" hidden>
      <div class="card">
        <div class="engine-list" id="engineList"></div>
        <div class="card-foot">
          <button class="btn" id="addEngine">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M8 3.4v9.2M3.4 8h9.2"/>
            </svg>
            添加引擎
          </button>
        </div>
      </div>
      <div id="enginesValidation"></div>
    </section>

    <section class="section" id="sec-newtab" hidden>
      <div class="card" id="card-newTab"></div>
    </section>

    <section class="section" id="sec-behavior" hidden>
      <div class="card" id="card-behavior"></div>
    </section>

    <section class="section" id="sec-advanced" hidden>
      <div class="card" id="card-advanced"></div>
    </section>

    <section class="section" id="sec-backup" hidden>
      <div class="card" id="card-backup"></div>
    </section>

    <div class="prototype-note">
      命令与默认键位取自本扩展的内核（74 条命令、69 条默认键位）。
      校验规则按 <code>background_scripts/commands.js</code> 的 <code>KeyMappingsParser</code> 复刻。
      <div class="controls">
        <div class="seg" role="group" aria-label="主题">
          <button data-theme="light" aria-pressed="false">浅色</button>
          <button data-theme="auto" aria-pressed="true">自动</button>
          <button data-theme="dark" aria-pressed="false">深色</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="savebar">
  <div class="savebar-inner">
    <span class="savebar-text" id="savebarText" role="status">所有更改已保存</span>
    <button class="btn" id="revertBtn" disabled>还原</button>
    <button class="btn primary" id="saveBtn" disabled>保存更改</button>
  </div>
</div>



<script defer src="/options/language.js"></script>
<script defer src="/options/index.js"></script></body>
</html>
